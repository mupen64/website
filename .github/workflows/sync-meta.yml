name: Sync meta

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-meta
  cancel-in-progress: false

jobs:
  sync-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect upstream release metadata
        run: |
          set -euo pipefail

          api_headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GITHUB_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          require_value() {
            value="$1"
            label="$2"
            if [ -z "${value}" ] || [ "${value}" = "null" ]; then
              echo "Failed to resolve ${label}" >&2
              exit 1
            fi
          }

          workdir="${RUNNER_TEMP}/sync-meta"
          rm -rf "${workdir}"
          mkdir -p "${workdir}"

          curl -fsSL "${api_headers[@]}" https://api.github.com/repos/mupen64/mupen64-rr-lua/releases/latest > "${workdir}/mupen64-stable.json"
          curl -fsSL "${api_headers[@]}" https://api.github.com/repos/mupen64/mupen64-rr-lua/commits/main > "${workdir}/mupen64-nightly.json"
          curl -fsSL "${api_headers[@]}" https://api.github.com/repos/mupen64/SM64LuaRedux/releases/latest > "${workdir}/redux-stable.json"
          curl -fsSL "${api_headers[@]}" https://api.github.com/repos/mupen64/SM64LuaRedux/commits/main > "${workdir}/redux-nightly.json"

          mupen_stable_version="$(jq -r '.tag_name' "${workdir}/mupen64-stable.json")"
          mupen_stable_updated_at="$(jq -r '.published_at' "${workdir}/mupen64-stable.json")"
          mupen_nightly_updated_at="$(jq -r '.commit.committer.date' "${workdir}/mupen64-nightly.json")"
          redux_stable_version="$(jq -r '.tag_name' "${workdir}/redux-stable.json")"
          redux_stable_updated_at="$(jq -r '.published_at' "${workdir}/redux-stable.json")"
          redux_nightly_updated_at="$(jq -r '.commit.committer.date' "${workdir}/redux-nightly.json")"

          require_value "${mupen_stable_version}" "latest release tag for mupen64/mupen64-rr-lua"
          require_value "${mupen_stable_updated_at}" "latest release timestamp for mupen64/mupen64-rr-lua"
          require_value "${mupen_nightly_updated_at}" "latest commit timestamp for mupen64/mupen64-rr-lua"
          require_value "${redux_stable_version}" "latest release tag for mupen64/SM64LuaRedux"
          require_value "${redux_stable_updated_at}" "latest release timestamp for mupen64/SM64LuaRedux"
          require_value "${redux_nightly_updated_at}" "latest commit timestamp for mupen64/SM64LuaRedux"

          jq -n --tab \
            --arg mupen_stable_version "${mupen_stable_version}" \
            --arg mupen_stable_updated_at "${mupen_stable_updated_at}" \
            --arg mupen_nightly_updated_at "${mupen_nightly_updated_at}" \
            --arg redux_stable_version "${redux_stable_version}" \
            --arg redux_stable_updated_at "${redux_stable_updated_at}" \
            --arg redux_nightly_updated_at "${redux_nightly_updated_at}" \
            '{
              mupen64: {
                stable: {
                  version: $mupen_stable_version,
                  updated_at: $mupen_stable_updated_at
                },
                nightly: {
                  updated_at: $mupen_nightly_updated_at
                }
              },
              redux: {
                stable: {
                  version: $redux_stable_version,
                  updated_at: $redux_stable_updated_at
                },
                nightly: {
                  updated_at: $redux_nightly_updated_at
                }
              }
            }' > src/lib/assets/meta.json

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/lib/assets/meta.json

          if git diff --cached --quiet; then
            echo "No metadata changes to commit"
            exit 0
          fi

          git commit -m "chore: sync meta"
          git push
